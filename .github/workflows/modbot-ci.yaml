name: modbot-ci

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.26
      uses: actions/setup-go@v7
      with:
        go-version: 1.26
      id: go
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Get dependencies
      run: |
        go get -v -t -d ./...
    - name: Test
      run: go test -v ./...
    - name: Build
      run: go build -v .
